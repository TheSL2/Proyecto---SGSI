services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgsi_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./storage:/var/www/storage
      - app_public:/var/www/public
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sgsi

  nginx:
    image: nginx:alpine
    container_name: sgsi_nginx
    restart: unless-stopped
    ports:
      - "8090:80"
      - "8443:443"
    volumes:
      - app_public:/var/www/public:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - sgsi

  db:
    image: mysql:8.0
    container_name: sgsi_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sgsi_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sgsi

  redis:
    image: redis:alpine
    container_name: sgsi_redis
    restart: unless-stopped
    networks:
      - sgsi

volumes:
  sgsi_db_data:
  app_public:

networks:
  sgsi:
    driver: bridge
